<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валідація форми</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="registrationForm" novalidate>
        <div class="form-group">
            <label for="username">Ім'я користувача:</label>
            <input type="text" id="username" name="username">
            <span class="error" id="usernameError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password">
            <span class="error" id="passwordError"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Підтвердження паролю:</label>
            <input type="password" id="confirmPassword" name="confirmPassword">
            <span class="error" id="confirmPasswordError"></span>
        </div>

        <div class="form-group">
            <label for="phone">Телефон (у форматі +380XXXXXXXXX):</label>
            <input type="tel" id="phone" name="phone" placeholder="+380">
            <span class="error" id="phoneError"></span>
        </div>

        <div class="form-group">
            <label for="birthdate">Дата народження:</label>
            <input type="date" id="birthdate" name="birthdate">
            <span class="error" id="birthdateError"></span>
        </div>

        <div class="form-group checkbox">
            <input type="checkbox" id="terms" name="terms">
            <label for="terms">Згода з умовами</label>
        </div>
        <div class="error" id="termsError" style="margin-top: -10px; margin-bottom: 15px;"></div>

        <button type="submit">Зареєструватися</button>
    </form>

    <script src="validation.js"></script>
</body>
</html>
